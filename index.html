<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyAI - Quản lý Học tập & Ôn thi Thông minh GDPT 2018</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <!-- React & ReactDOM (Production UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone (để biên dịch JSX trực tiếp trên trình duyệt) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- PDF.js for reading PDF files in browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>

  <!-- Main Application Script (Babel JSX) -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- Helper Component for Lucide Icons ---
    const Icon = ({ name, size = 18, className = "" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (iconRef.current && window.lucide) {
          iconRef.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name);
          i.setAttribute('class', className);
          i.style.width = `${size}px`;
          i.style.height = `${size}px`;
          iconRef.current.appendChild(i);
          window.lucide.createIcons({ root: iconRef.current });
        }
      }, [name, size, className]);
      return <span ref={iconRef} className="inline-flex items-center justify-center shrink-0" />;
    };

    // --- Utility Functions ---
    const getTodayKey = () => new Date().toISOString().split('T')[0];

    const formatTime = (totalSeconds) => {
      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;
      if (hrs > 0) {
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    };

    const SUBJECT_COLORS = [
      { name: 'Xanh dương', bg: 'bg-blue-100', text: 'text-blue-700', dot: 'bg-blue-500' },
      { name: 'Xanh lá', bg: 'bg-emerald-100', text: 'text-emerald-700', dot: 'bg-emerald-500' },
      { name: 'Tím', bg: 'bg-purple-100', text: 'text-purple-700', dot: 'bg-purple-500' },
      { name: 'Cam', bg: 'bg-orange-100', text: 'text-orange-700', dot: 'bg-orange-500' },
      { name: 'Hồng', bg: 'bg-rose-100', text: 'text-rose-700', dot: 'bg-rose-500' },
      { name: 'Vàng hổ phách', bg: 'bg-amber-100', text: 'text-amber-700', dot: 'bg-amber-500' }
    ];

    const DEFAULT_SUBJECTS = [
      { id: 'sub-1', name: 'Toán học', colorIdx: 0 },
      { id: 'sub-2', name: 'Ngữ văn', colorIdx: 4 },
      { id: 'sub-3', name: 'Địa lí', colorIdx: 1 },
      { id: 'sub-4', name: 'Lịch sử', colorIdx: 3 }
    ];

    // --- Main Application ---
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [showSettings, setShowSettings] = useState(false);
      const [toast, setToast] = useState(null);

      const [apiKey, setApiKey] = useState(() => localStorage.getItem('studyai_gemini_key') || '');

      const [gamification, setGamification] = useState(() => {
        const saved = localStorage.getItem('studyai_gamification');
        return saved ? JSON.parse(saved) : {
          exp: 120,
          streak: 1,
          lastCheckIn: null
        };
      });

      const [studyLogs, setStudyLogs] = useState(() => {
        const saved = localStorage.getItem('studyai_logs');
        if (saved) return JSON.parse(saved);
        const initial = {};
        for (let i = 6; i >= 1; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          initial[d.toISOString().split('T')[0]] = [30, 45, 20, 60, 50, 75][6 - i];
        }
        initial[getTodayKey()] = 0;
        return initial;
      });

      const [subjects, setSubjects] = useState(() => {
        const saved = localStorage.getItem('studyai_subjects');
        return saved ? JSON.parse(saved) : DEFAULT_SUBJECTS;
      });
      const [todos, setTodos] = useState(() => {
        const saved = localStorage.getItem('studyai_todos');
        return saved ? JSON.parse(saved) : [
          { id: 't-1', title: 'Ôn tập chuyên đề Hàm số bậc hai', subjectId: 'sub-1', priority: 'high', deadline: getTodayKey(), completed: false },
          { id: 't-2', title: 'Đọc văn bản nghị luận xã hội GDPT 2018', subjectId: 'sub-2', priority: 'medium', deadline: getTodayKey(), completed: true }
        ];
      });

      const [savedExams, setSavedExams] = useState(() => {
        const saved = localStorage.getItem('studyai_exams');
        return saved ? JSON.parse(saved) : [];
      });

      useEffect(() => localStorage.setItem('studyai_gemini_key', apiKey), [apiKey]);
      useEffect(() => localStorage.setItem('studyai_gamification', JSON.stringify(gamification)), [gamification]);
      useEffect(() => localStorage.setItem('studyai_logs', JSON.stringify(studyLogs)), [studyLogs]);
      useEffect(() => localStorage.setItem('studyai_subjects', JSON.stringify(subjects)), [subjects]);
      useEffect(() => localStorage.setItem('studyai_todos', JSON.stringify(todos)), [todos]);
      useEffect(() => localStorage.setItem('studyai_exams', JSON.stringify(savedExams)), [savedExams]);

      const showNotification = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      const addStudyMinutes = (mins) => {
        if (mins <= 0) return;
        const today = getTodayKey();
        setStudyLogs(prev => ({
          ...prev,
          [today]: (prev[today] || 0) + mins
        }));
        setGamification(prev => ({
          ...prev,
          exp: prev.exp + mins * 2
        }));
        showNotification(`Đã ghi nhận +${mins} phút học (+${mins * 2} EXP)!`);
      };

      const handleDailyCheckIn = () => {
        const today = getTodayKey();
        if (gamification.lastCheckIn === today) return;

        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayKey = yesterday.toISOString().split('T')[0];

        const newStreak = gamification.lastCheckIn === yesterdayKey ? gamification.streak + 1 : 1;
        const bonusExp = 50 + Math.min(newStreak * 10, 100);

        setGamification({
          exp: gamification.exp + bonusExp,
          streak: newStreak,
          lastCheckIn: today
        });
        showNotification(`Điểm danh thành công! Streak ${newStreak} ngày (+${bonusExp} EXP)`);
      };

      const level = Math.floor(gamification.exp / 200) + 1;
      const expInLevel = gamification.exp % 200;

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          {/* Toast Notification */}
          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg text-sm font-medium transition-all ${
              toast.type === 'error' ? 'bg-rose-600 text-white' : 'bg-slate-900 text-white'
            }`}>
              <Icon name={toast.type === 'error' ? 'alert-circle' : 'check-circle-2'} size={18} />
              <span>{toast.msg}</span>
            </div>
          )}

          {/* Top Navigation Bar */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-2xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-sm">
                  <Icon name="graduation-cap" size={20} />
                </div>
                <div>
                  <h1 className="font-bold text-lg tracking-tight text-slate-900 leading-none">StudyAI</h1>
                  <span className="text-[11px] font-medium text-indigo-600">Chuẩn GDPT 2018</span>
                </div>
              </div>

              <nav className="flex items-center bg-slate-100 p-1 rounded-xl">
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-sm font-medium transition-all ${
                    activeTab === 'dashboard'
                      ? 'bg-white text-indigo-600 shadow-sm'
                      : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <Icon name="layout-dashboard" size={16} />
                  <span className="hidden sm:inline">Quản lý học tập</span>
                  <span className="sm:hidden">Học tập</span>
                </button>
                <button
                  onClick={() => setActiveTab('ai-exam')}
                  className={`flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-sm font-medium transition-all ${
                    activeTab === 'ai-exam'
                      ? 'bg-white text-indigo-600 shadow-sm'
                      : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <Icon name="sparkles" size={16} />
                  <span className="hidden sm:inline">Phòng ôn & Luyện thi AI</span>
                  <span className="sm:hidden">Ôn thi AI</span>
                </button>
              </nav>

              <div className="flex items-center gap-2 sm:gap-3">
                <div className="hidden md:flex items-center gap-3 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-xl text-xs">
                  <div className="flex items-center gap-1 text-amber-600 font-semibold" title="Chuỗi ngày học liên tiếp">
                    <Icon name="flame" size={15} className="fill-amber-500 text-amber-500" />
                    <span>{gamification.streak} ngày</span>
                  </div>
                  <div className="w-px h-3.5 bg-slate-200"></div>
                  <div className="flex items-center gap-1.5 text-indigo-600 font-semibold" title="Cấp độ & Điểm kinh nghiệm">
                    <span>Lv.{level}</span>
                    <div className="w-16 h-1.5 bg-slate-200 rounded-full overflow-hidden">
                      <div className="h-full bg-indigo-600 rounded-full" style={{ width: `${(expInLevel / 200) * 100}%` }}></div>
                    </div>
                    <span className="text-slate-500 font-normal">{gamification.exp} EXP</span>
                  </div>
                </div>

                <button
                  onClick={() => setShowSettings(true)}
                  className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-medium border transition-all ${
                    !apiKey
                      ? 'bg-amber-50 border-amber-300 text-amber-700 hover:bg-amber-100'
                      : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'
                  }`}
                >
                  <Icon name="settings" size={16} />
                  <span className="hidden sm:inline">{apiKey ? 'Cài đặt' : 'Nhập API Key'}</span>
                </button>
              </div>
            </div>
          </header>

          {/* Main Workspace */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6">
            {activeTab === 'dashboard' ? (
              <DashboardTab
                subjects={subjects}
                setSubjects={setSubjects}
                todos={todos}
                setTodos={setTodos}
                gamification={gamification}
                onCheckIn={handleDailyCheckIn}
                studyLogs={studyLogs}
                onAddStudyMinutes={addStudyMinutes}
                showNotification={showNotification}
              />
            ) : (
              <AIExamTab
                apiKey={apiKey}
                onOpenSettings={() => setShowSettings(true)}
                savedExams={savedExams}
                setSavedExams={setSavedExams}
                showNotification={showNotification}
                onCompleteExam={(xp) => {
                  setGamification(prev => ({ ...prev, exp: prev.exp + xp }));
                }}
              />
            )}
          </main>

          {/* Settings Modal */}
          {showSettings && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100">
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center">
                      <Icon name="key-round" size={18} />
                    </div>
                    <h2 className="font-bold text-lg text-slate-900">Cài đặt Gemini API</h2>
                  </div>
                  <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-slate-600 p-1">
                    <Icon name="x" size={20} />
                  </button>
                </div>

                <p className="text-sm text-slate-600 mb-4 leading-relaxed">
                  Nhập <strong>Gemini API Key</strong> để sử dụng tính năng tạo đề thi tự động với mô hình <code className="bg-slate-100 px-1.5 py-0.5 rounded text-indigo-600 font-mono text-xs">gemini-2.5-flash</code>.
                </p>

                <div className="space-y-3 mb-5">
                  <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500">
                    Google AI Studio API Key
                  </label>
                  <input
                    type="password"
                    value={apiKey}
                    onChange={(e) => setApiKey(e.target.value)}
                    placeholder="AIzaSy..."
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                  <a
                    href="https://aistudio.google.com/app/apikey"
                    target="_blank"
                    rel="noreferrer"
                    className="inline-flex items-center gap-1 text-xs font-medium text-indigo-600 hover:underline"
                  >
                    <span>Lấy API Key miễn phí tại Google AI Studio</span>
                    <Icon name="external-link" size={12} />
                  </a>
                </div>

                <div className="flex justify-end gap-2">
                  <button
                    onClick={() => setShowSettings(false)}
                    className="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100"
                  >
                    Đóng
                  </button>
                  <button
                    onClick={() => {
                      setShowSettings(false);
                      showNotification('Đã lưu cấu hình API Key!');
                    }}
                    className="px-4 py-2 rounded-xl text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-700 shadow-xs"
                  >
                    Lưu cài đặt
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- TAB 1: DASHBOARD & PLANNER ---
    function DashboardTab({
      subjects, setSubjects, todos, setTodos,
      gamification, onCheckIn, studyLogs, onAddStudyMinutes, showNotification
    }) {
      const [newSubjectName, setNewSubjectName] = useState('');
      const [newSubjectColor, setNewSubjectColor] = useState(0);
      const [selectedSubjectFilter, setSelectedSubjectFilter] = useState('all');

      const [todoTitle, setTodoTitle] = useState('');
      const [todoSubject, setTodoSubject] = useState(subjects[0]?.id || '');
      const [todoPriority, setTodoPriority] = useState('medium');
      const [todoDeadline, setTodoDeadline] = useState(getTodayKey());

      const [timerMode, setTimerMode] = useState('pomodoro');
      const [isRunning, setIsRunning] = useState(false);
      const [pomoPhase, setPomoPhase] = useState('focus');
      const [pomoSeconds, setPomoSeconds] = useState(25 * 60);
      const [customCountdownMins, setCustomCountdownMins] = useState(45);
      const [countdownSeconds, setCountdownSeconds] = useState(45 * 60);
      const [countupSeconds, setCountupSeconds] = useState(0);

      useEffect(() => {
        if (!isRunning) return;
        const interval = setInterval(() => {
          if (timerMode === 'pomodoro') {
            setPomoSeconds(prev => {
              if (prev <= 1) {
                setIsRunning(false);
                if (pomoPhase === 'focus') {
                  onAddStudyMinutes(25);
                  setPomoPhase('break');
                  return 5 * 60;
                } else {
                  showNotification('Hết giờ nghỉ! Sẵn sàng quay lại học nhé.');
                  setPomoPhase('focus');
                  return 25 * 60;
                }
              }
              return prev - 1;
            });
          } else if (timerMode === 'countdown') {
            setCountdownSeconds(prev => {
              if (prev <= 1) {
                setIsRunning(false);
                onAddStudyMinutes(Number(customCountdownMins) || 1);
                return (Number(customCountdownMins) || 45) * 60;
              }
              return prev - 1;
            });
          } else if (timerMode === 'countup') {
            setCountupSeconds(prev => prev + 1);
          }
        }, 1000);
        return () => clearInterval(interval);
      }, [isRunning, timerMode, pomoPhase, customCountdownMins]);

      const handleResetTimer = () => {
        setIsRunning(false);
        if (timerMode === 'pomodoro') {
          setPomoSeconds(pomoPhase === 'focus' ? 25 * 60 : 5 * 60);
        } else if (timerMode === 'countdown') {
          setCountdownSeconds((Number(customCountdownMins) || 45) * 60);
        } else {
          if (countupSeconds >= 60) {
            const mins = Math.floor(countupSeconds / 60);
            onAddStudyMinutes(mins);
          }
          setCountupSeconds(0);
        }
      };

      const handleSaveCountup = () => {
        setIsRunning(false);
        const mins = Math.max(1, Math.round(countupSeconds / 60));
        onAddStudyMinutes(mins);
        setCountupSeconds(0);
      };

      const handleAddSubject = (e) => {
        e.preventDefault();
        if (!newSubjectName.trim()) return;
        const newSub = {
          id: `sub-${Date.now()}`,
          name: newSubjectName.trim(),
          colorIdx: newSubjectColor
        };
        setSubjects([...subjects, newSub]);
        if (!todoSubject) setTodoSubject(newSub.id);
        setNewSubjectName('');
        showNotification(`Đã thêm môn "${newSub.name}"`);
      };

      const handleDeleteSubject = (id) => {
        setSubjects(subjects.filter(s => s.id !== id));
        setTodos(todos.filter(t => t.subjectId !== id));
        if (selectedSubjectFilter === id) setSelectedSubjectFilter('all');
      };

      const handleAddTodo = (e) => {
        e.preventDefault();
        if (!todoTitle.trim()) return;
        const newTodo = {
          id: `todo-${Date.now()}`,
          title: todoTitle.trim(),
          subjectId: todoSubject || subjects[0]?.id || '',
          priority: todoPriority,
          deadline: todoDeadline,
          completed: false
        };
        setTodos([newTodo, ...todos]);
        setTodoTitle('');
      };

      const toggleTodo = (id) => {
        setTodos(todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
      };

      const deleteTodo = (id) => {
        setTodos(todos.filter(t => t.id !== id));
      };

      const chartData = useMemo(() => {
        const days = [];
        const dayNames = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const key = d.toISOString().split('T')[0];
          days.push({
            key,
            label: i === 0 ? 'Hôm nay' : dayNames[d.getDay()],
            dateStr: `${d.getDate()}/${d.getMonth() + 1}`,
            minutes: studyLogs[key] || 0
          });
        }
        return days;
      }, [studyLogs]);

      const maxChartMinutes = Math.max(...chartData.map(d => d.minutes), 60);
      const totalWeekMinutes = chartData.reduce((acc, cur) => acc + cur.minutes, 0);
      const filteredTodos = todos.filter(t => selectedSubjectFilter === 'all' ? true : t.subjectId === selectedSubjectFilter);
      const isCheckedInToday = gamification.lastCheckIn === getTodayKey();

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div className="lg:col-span-5 space-y-6">
            <div className="bg-gradient-to-br from-indigo-600 via-indigo-600 to-violet-700 rounded-2xl p-5 text-white shadow-sm">
              <div className="flex items-start justify-between gap-4">
                <div>
                  <div className="inline-flex items-center gap-1.5 bg-white/15 px-2.5 py-1 rounded-full text-xs font-medium mb-2">
                    <Icon name="flame" size={14} className="text-amber-300 fill-amber-300" />
                    <span>Chuỗi {gamification.streak} ngày liên tiếp</span>
                  </div>
                  <h2 className="text-lg font-bold">Điểm danh học tập mỗi ngày</h2>
                  <p className="text-indigo-100 text-xs mt-1">Tích lũy EXP để thăng cấp và giữ vững phong độ.</p>
                </div>
                <button
                  onClick={onCheckIn}
                  disabled={isCheckedInToday}
                  className={`px-4 py-2.5 rounded-xl text-xs font-bold shrink-0 transition-all shadow-sm ${
                    isCheckedInToday ? 'bg-white/25 text-white/90 cursor-default' : 'bg-amber-400 text-slate-900 hover:bg-amber-300 active:scale-95'
                  }`}
                >
                  {isCheckedInToday ? 'Đã điểm danh ✓' : 'Điểm danh +EXP'}
                </button>
              </div>
              <div className="mt-4 pt-3 border-t border-white/15 flex items-center justify-between text-xs text-indigo-100">
                <span>Tổng kinh nghiệm: <strong className="text-white">{gamification.exp} EXP</strong></span>
                <span>Hôm nay: <strong className="text-white">{studyLogs[getTodayKey()] || 0} phút</strong></span>
              </div>
            </div>

            <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs">
              <div className="flex items-center justify-between mb-4">
                <h3 className="font-bold text-slate-800 flex items-center gap-2">
                  <Icon name="timer" size={18} className="text-indigo-600" />
                  <span>Đồng hồ tập trung</span>
                </h3>
                <div className="flex bg-slate-100 p-0.5 rounded-lg text-xs font-medium">
                  {[
                    { id: 'pomodoro', label: 'Pomodoro' },
                    { id: 'countdown', label: 'Countdown' },
                    { id: 'countup', label: 'Countup' }
                  ].map(m => (
                    <button
                      key={m.id}
                      onClick={() => { setIsRunning(false); setTimerMode(m.id); }}
                      className={`px-2.5 py-1 rounded-md transition-all ${

                    className={`px-3 py-1 rounded-full text-xs font-medium ${pomoPhase === 'break' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'}`}

              {timerMode === 'countdown' && (
                <div className="flex items-center justify-center gap-2 mb-3 text-xs">
                  <span className="text-slate-500">Đặt số phút:</span>
                  <input
                    type="number"
                    min="1"
                    max="300"

                    onChange={(e) => {
                      const val = Math.max(1, parseInt(e.target.value) || 1);
                      setCustomCountdownMins(val);
                      setCountdownSeconds(val * 60);

                  <input

                            }`}

                            </p>

                              <span className={`px-2 py-0.5 rounded-md text-[11px] font-medium border ${priorityBadge.cls}`}>{priorityBadge.label}</span>
                              {todo.deadline && <span className="text-[11px] text-slate-500">📅 {todo.deadline}</span>}
                            </div>
                          </div>
                        </div>
                        <button onClick={() => deleteTodo(todo.id)} className="text-slate-400 hover:text-rose-600 p-1.5 rounded-lg">

    // --- TAB 2: AI EXAM & PRACTICE ---
    function AIExamTab({ apiKey, onOpenSettings, savedExams, setSavedExams, showNotification, onCompleteExam }) {
      const MAX_CHARS = 50000;
      const [view, setView] = useState('create');
      const [examTitle, setExamTitle] = useState('');
      const [sourceText, setSourceText] = useState('');
      const [isReadingFile, setIsReadingFile] = useState(false);
      const [countMode, setCountMode] = useState('preset');
      const [presetCount, setPresetCount] = useState(10);
      const [customCount, setCustomCount] = useState(15);
      const [difficulty, setDifficulty] = useState('Trung bình');
      const [questionType, setQuestionType] = useState('mcq');
      const [examMode, setExamMode] = useState('exam');
      const [isGenerating, setIsGenerating] = useState(false);

      const [currentExam, setCurrentExam] = useState(null);
      const [userAnswers, setUserAnswers] = useState({});
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [elapsedSeconds, setElapsedSeconds] = useState(0);

      useEffect(() => {
        if (view !== 'take-exam' || isSubmitted) return;
        const timer = setInterval(() => setElapsedSeconds(prev => prev + 1), 1000);
        return () => clearInterval(timer);
      }, [view, isSubmitted]);

      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setIsReadingFile(true);
        try {
          let extracted = '';
          if (file.name.toLowerCase().endsWith('.pdf')) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const pagesText = [];
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const content = await page.getTextContent();
              pagesText.push(content.items.map(item => item.str).join(' '));
            }
            extracted = pagesText.join('\n\n');
          } else {
            extracted = await file.text();
          }

          if (extracted.length > MAX_CHARS) {
            extracted = extracted.slice(0, MAX_CHARS);
            showNotification(`Tài liệu vượt quá 50.000 ký tự, đã lấy 50.000 ký tự đầu.`, 'error');
          } else {
            showNotification(`Đã đọc xong file "${file.name}"`);
          }

          setSourceText(extracted);
          if (!examTitle) setExamTitle(`Đề ôn tập: ${file.name.replace(/\.[^/.]+$/, '')}`);
        } catch (err) {
          showNotification('Không thể đọc file này. Thử file .txt, .md hoặc .pdf khác.', 'error');
        } finally {
          setIsReadingFile(false);
          e.target.value = '';
        }
      };

      const handleGenerateExam = async (overrideSeed = false) => {
        if (!apiKey) {
          onOpenSettings();
          showNotification('Vui lòng nhập Gemini API Key trước!', 'error');
          return;
        }
        if (!sourceText.trim() || sourceText.trim().length < 30) {
          showNotification('Vui lòng nhập hoặc tải tài liệu (tối thiểu 30 ký tự).', 'error');
          return;
        }

        const finalCount = countMode === 'preset' ? presetCount : Math.min(50, Math.max(1, Number(customCount) || 5));
        const finalTitle = examTitle.trim() || `Đề ôn luyện GDPT 2018 (${new Date().toLocaleDateString('vi-VN')})`;

        const typeDescriptions = {
          mcq: 'Trắc nghiệm 4 đáp án (1 đáp án đúng)',
          true_false: 'Trắc nghiệm Đúng/Sai chuẩn GDPT 2018 (4 mệnh đề a, b, c, d)',
          fill_blank: 'Điền khuyết (từ khóa hoặc số liệu)',
          short_essay: 'Tự luận ngắn'
        };

        const systemPrompt = `Bạn là chuyên gia khảo thí GDPT 2018. Biên soạn đề kiểm tra bám sát nội dung tài liệu.
Số lượng câu: ${finalCount}. Mức độ: ${difficulty}. Dạng bài: ${typeDescriptions[questionType]}.
${overrideSeed ? `Tạo bộ câu hỏi HOÀN TOÀN MỚI (${Date.now()}).` : ''}

ĐỊNH DẠNG JSON THUẦN TÚY (KHÔNG MARKDOWN):
{
  "questions": [
    {
      "id": 1,
      "type": "${questionType}",
      "question": "Nội dung câu hỏi",
      "options": [],
      "correctAnswer": "Đáp án chuẩn",
      "explanation": "Giải thích chi tiết theo GDPT 2018."
    }
  ]
}`;

        setIsGenerating(true);
        try {
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ role: 'user', parts: [{ text: systemPrompt }, { text: `TÀI LIỆU:\n${sourceText.slice(0, MAX_CHARS)}` }] }],
                generationConfig: { temperature: 0.7, responseMimeType: 'application/json' }
              })
            }
          );

          if (!response.ok) throw new Error('Lỗi gọi API Gemini.');
          const data = await response.json();
          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          const cleanedJson = rawText.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim();
          const parsed = JSON.parse(cleanedJson);

          const newExamObj = {
            id: `exam-${Date.now()}`,
            title: finalTitle,
            createdAt: new Date().toLocaleString('vi-VN'),
            difficulty,
            questionType,
            sourceText: sourceText.slice(0, MAX_CHARS),
            questions: parsed.questions
          };

          setSavedExams(prev => [newExamObj, ...prev]);
          startExam(newExamObj, examMode);
          showNotification(`Đã tạo thành công "${finalTitle}"!`);
        } catch (err) {
          showNotification(`Lỗi: ${err.message}`, 'error');
        } finally {
          setIsGenerating(false);
        }
      };

      const startExam = (exam, mode = 'exam') => {
        setCurrentExam(exam);
        setExamMode(mode);
        setUserAnswers({});
        setIsSubmitted(false);
        setElapsedSeconds(0);
        setView('take-exam');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const evaluateQuestion = (q, ans) => {
        if (q.type === 'mcq') {
          if (!ans) return false;
          return ans.trim().toLowerCase() === String(q.correctAnswer).trim().toLowerCase();
        }
        if (q.type === 'true_false') {
          if (!ans || typeof ans !== 'object') return false;
          const expectedParts = String(q.correctAnswer).split(',').map(s => s.trim().toLowerCase());
          return [0, 1, 2, 3].every(i => (ans[i] || '').toLowerCase() === expectedParts[i]);
        }
        if (q.type === 'fill_blank') {
          if (!ans) return false;
          return ans.trim().toLowerCase() === String(q.correctAnswer).trim().toLowerCase();
        }
        return Boolean(ans && ans.trim().length > 0);
      };

      const handleSubmitExam = () => {
        setIsSubmitted(true);
        const total = currentExam.questions.length;
        const correctCount = currentExam.questions.filter(q => evaluateQuestion(q, userAnswers[q.id])).length;
        const earnedXp = correctCount * 15 + 20;
        onCompleteExam(earnedXp);
        showNotification(`Đã nộp bài! Đạt ${correctCount}/${total} câu (+${earnedXp} EXP)`);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      if (view === 'take-exam' && currentExam) {
        const totalQ = currentExam.questions.length;
        const correctQ = isSubmitted ? currentExam.questions.filter(q => evaluateQuestion(q, userAnswers[q.id])).length : 0;
        const score10 = isSubmitted ? ((correctQ / totalQ) * 10).toFixed(2) : 0;

        return (
          <div className="max-w-4xl mx-auto space-y-6">
            <div className="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs sticky top-20 z-20 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <button onClick={() => setView('create')} className="p-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-100">
                  <Icon name="arrow-left" size={18} />
                </button>
                <div>
                  <div className="flex items-center gap-2">
                    <span className={`px-2 py-0.5 rounded-md text-[11px] font-bold ${examMode === 'exam' ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>
                      {examMode === 'exam' ? 'Tự luyện thi' : 'Ôn tập'}
                    </span>
                    <span className="text-xs text-slate-500">{currentExam.difficulty}</span>
                  </div>
                  <h2 className="font-bold text-slate-900 truncate mt-0.5">{currentExam.title}</h2>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <div className="flex items-center gap-2 bg-slate-100 px-3.5 py-2 rounded-xl font-mono text-sm font-bold text-slate-800">
                  <Icon name="clock" size={16} className="text-indigo-600" />
                  <span>{formatTime(elapsedSeconds)}</span>
                </div>
                {!isSubmitted ? (
                  <button onClick={handleSubmitExam} className="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-bold hover:bg-indigo-700 flex items-center gap-2">
                    <Icon name="send" size={16} />
                    <span>Nộp bài</span>
                  </button>
                ) : (
                  <button onClick={() => startExam(currentExam, examMode)} className="px-4 py-2 rounded-xl bg-slate-800 text-white text-sm font-semibold hover:bg-slate-900 flex items-center gap-1.5">
                    <Icon name="rotate-ccw" size={15} />
                    <span>Làm lại</span>
                  </button>
                )}
              </div>
            </div>

            {isSubmitted && (
              <div className="bg-gradient-to-r from-indigo-600 to-violet-600 rounded-2xl p-6 text-white shadow-sm flex flex-wrap items-center justify-between gap-4">
                <div>
                  <span className="text-xs uppercase tracking-wider font-semibold text-indigo-200">Kết quả bài làm</span>
                  <h3 className="text-2xl font-bold mt-1">Điểm số: {score10} / 10 điểm ({correctQ}/{totalQ} câu)</h3>
                  <p className="text-sm text-indigo-100 mt-1">Xem chi tiết đáp án và lời giải bên dưới.</p>
                </div>
                {currentExam.sourceText && (
                  <button
                    onClick={() => { setSourceText(currentExam.sourceText); setExamTitle(`${currentExam.title} (Đề mới)`); handleGenerateExam(true); }}
                    disabled={isGenerating}
                    className="px-4 py-2.5 rounded-xl bg-white text-indigo-700 font-bold text-sm hover:bg-indigo-50 flex items-center gap-2"
                  >
                    <Icon name="refresh-cw" size={16} className={isGenerating ? 'animate-spin' : ''} />
                    <span>Tạo đề mới từ tài liệu</span>
                  </button>
                )}
              </div>
            )}

            <div className="space-y-4">
              {currentExam.questions.map((q, index) => {
                const userAns = userAnswers[q.id];
                const isCorrect = isSubmitted ? evaluateQuestion(q, userAns) : null;

                return (
                  <div key={q.id || index} className={`bg-white rounded-2xl border p-5 ${!isSubmitted ? 'border-slate-200' : isCorrect ? 'border-emerald-300 bg-emerald-50/20' : 'border-rose-300 bg-rose-50/20'}`}>
                    <div className="flex items-start justify-between gap-3 mb-3">
                      <span className="px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700 text-xs font-bold">Câu {index + 1}</span>
                      {isSubmitted && (
                        <span className={`px-2.5 py-1 rounded-lg text-xs font-bold ${isCorrect ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                          {isCorrect ? '✓ Chính xác' : '✕ Chưa chính xác'}
                        </span>
                      )}
                    </div>
                    <p className="text-slate-900 font-medium text-base leading-relaxed whitespace-pre-line mb-4">{q.question}</p>

                    {q.type === 'mcq' && Array.isArray(q.options) && (
                      <div className="space-y-2">
                        {q.options.map((opt, optIdx) => {
                          const selected = userAns === opt;
                          const isThisCorrect = isSubmitted && opt.trim().toLowerCase() === String(q.correctAnswer).trim().toLowerCase();
                          let btnStyle = 'border-slate-200 hover:bg-slate-50 text-slate-700';
                          if (isSubmitted) {
                            if (isThisCorrect) btnStyle = 'border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold';
                            else if (selected && !isThisCorrect) btnStyle = 'border-rose-400 bg-rose-50 text-rose-900';
                            else btnStyle = 'border-slate-200 opacity-60';
                          } else if (selected) {
                            btnStyle = 'border-indigo-600 bg-indigo-50/70 text-indigo-900 font-medium ring-1 ring-indigo-600';
                          }
                          return (
                            <button
                              key={optIdx}
                              type="button"
                              disabled={isSubmitted}
                              onClick={() => setUserAnswers({ ...userAnswers, [q.id]: opt })}
                              className={`w-full text-left p-3.5 rounded-xl border text-sm transition-all flex items-center gap-3 ${btnStyle}`}
                            >
                              <span className="w-6 h-6 rounded-full border border-current flex items-center justify-center text-xs font-bold shrink-0">
                                {['A', 'B', 'C', 'D'][optIdx]}
                              </span>
                              <span>{opt}</span>
                            </button>
                          );
                        })}
                      </div>
                    )}

                    {q.type === 'true_false' && Array.isArray(q.options) && (
                      <div className="space-y-2.5">
                        {q.options.map((stmt, sIdx) => {
                          const currentSubAns = (userAns && userAns[sIdx]) || '';
                          const expectedArr = String(q.correctAnswer).split(',').map(s => s.trim());
                          const expectedVal = expectedArr[sIdx] || '';
                          return (
                            <div key={sIdx} className="p-3 rounded-xl border border-slate-200 bg-slate-50/50 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                              <span className="text-sm text-slate-800">{stmt}</span>
                              <div className="flex items-center gap-2 shrink-0">
                                {['Đúng', 'Sai'].map(choice => {
                                  const isPicked = currentSubAns === choice;
                                  let cls = 'bg-white border-slate-300 text-slate-600 hover:bg-slate-100';
                                  if (isSubmitted) {
                                    if (expectedVal.toLowerCase() === choice.toLowerCase()) cls = 'bg-emerald-600 border-emerald-600 text-white font-bold';
                                    else if (isPicked) cls = 'bg-rose-500 border-rose-500 text-white';
                                    else cls = 'bg-white border-slate-200 text-slate-400';
                                  } else if (isPicked) {
                                    cls = 'bg-indigo-600 border-indigo-600 text-white font-semibold';
                                  }
                                  return (
                                    <button
                                      key={choice}
                                      type="button"
                                      disabled={isSubmitted}
                                      onClick={() => {
                                        const prevObj = typeof userAns === 'object' && userAns !== null ? userAns : {};
                                        setUserAnswers({ ...userAnswers, [q.id]: { ...prevObj, [sIdx]: choice } });
                                      }}
                                      className={`px-3.5 py-1.5 rounded-lg border text-xs transition-all ${cls}`}
                                    >
                                      {choice}
                                    </button>
                                  );
                                })}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}

                    {(q.type === 'fill_blank' || q.type === 'short_essay') && (
                      q.type === 'fill_blank' ? (
                        <input
                          type="text"
                          disabled={isSubmitted}
                          value={userAns || ''}
                          onChange={(e) => setUserAnswers({ ...userAnswers, [q.id]: e.target.value })}
                          placeholder="Nhập từ hoặc cụm từ..."
                          className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:bg-slate-100"
                        />
                      ) : (
                        <textarea
                          rows="3"
                          disabled={isSubmitted}
                          value={userAns || ''}
                          onChange={(e) => setUserAnswers({ ...userAnswers, [q.id]: e.target.value })}
                          placeholder="Nhập câu trả lời..."
                          className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:bg-slate-100"
                        />
                      )
                    )}

                    {isSubmitted && (
                      <div className="mt-4 pt-4 border-t border-slate-200 bg-white/80 rounded-xl p-3.5 space-y-1.5 text-sm">
                        <div className="font-bold text-emerald-700">✓ Đáp án chuẩn: {q.correctAnswer}</div>
                        <p className="text-slate-600"><strong>Giải thích:</strong> {q.explanation}</p>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div className="lg:col-span-7 bg-white rounded-2xl border border-slate-200 p-6 shadow-xs space-y-5">
            <div>
              <h2 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                <Icon name="sparkles" size={20} className="text-indigo-600" />
                <span>Tạo đề ôn & Luyện thi AI (GDPT 2018)</span>
              </h2>
              <p className="text-xs text-slate-500 mt-1">Tải tài liệu học tập để AI biên soạn đề thi bám sát chương trình.</p>
            </div>

            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Tên bài kiểm tra</label>
              <input
                type="text"
                value={examTitle}
                onChange={(e) => setExamTitle(e.target.value)}
                placeholder="VD: Ôn tập Công nghệ cơ khí 11..."
                className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
            </div>

            <div>
              <div className="flex items-center justify-between mb-1.5">
                <label className="text-xs font-bold uppercase tracking-wider text-slate-600">Nội dung tài liệu</label>
                <label className="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-indigo-50 text-indigo-700 text-xs font-semibold hover:bg-indigo-100 cursor-pointer">
                  <Icon name="upload" size={14} />
                  <span>{isReadingFile ? 'Đang đọc file...' : 'Tải file (.txt, .md, .pdf)'}</span>
                  <input type="file" accept=".txt,.md,.pdf" onChange={handleFileUpload} disabled={isReadingFile} className="hidden" />
                </label>
              </div>
              <textarea
                rows="7"
                value={sourceText}
                onChange={(e) => { if (e.target.value.length <= MAX_CHARS) setSourceText(e.target.value); }}
                placeholder="Dán nội dung bài học hoặc tải file lên..."
                className="w-full p-3.5 rounded-xl border border-slate-200 text-sm leading-relaxed focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
              <div className="flex items-center justify-between mt-1.5 text-xs text-slate-400">
                <span>Hỗ trợ PDF, Markdown, TXT</span>
                <span>{sourceText.length.toLocaleString()} / {MAX_CHARS.toLocaleString()} ký tự</span>
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Số lượng câu hỏi</label>
                <div className="flex items-center gap-1.5">
                  {[5, 10, 20].map(num => (
                    <button
                      key={num}
                      type="button"
                      onClick={() => { setCountMode('preset'); setPresetCount(num); }}
                      className={`px-3 py-2 rounded-xl text-xs font-bold border ${countMode === 'preset' && presetCount === num ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-700 border-slate-200'}`}
                    >
                      {num} câu
                    </button>
                  ))}
                  <button
                    type="button"
                    onClick={() => setCountMode('custom')}
                    className={`px-3 py-2 rounded-xl text-xs font-bold border ${countMode === 'custom' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-700 border-slate-200'}`}
                  >
                    Tùy chỉnh
                  </button>
                </div>
                {countMode === 'custom' && (
                  <div className="mt-2 flex items-center gap-2">
                    <input
                      type="number"
                      min="1"
                      max="50"
                      value={customCount}
                      onChange={(e) => setCustomCount(e.target.value)}
                      className="w-24 px-3 py-1.5 rounded-lg border border-slate-300 text-sm font-semibold"
                    />
                    <span className="text-xs text-slate-500">câu (tối đa 50)</span>
                  </div>
                )}
              </div>

              <div>
                <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Mức độ phân hóa</label>
                <div className="grid grid-cols-3 gap-1.5">
                  {['Dễ', 'Trung bình', 'Khó'].map(lvl => (
                    <button
                      key={lvl}
                      type="button"
                      onClick={() => setDifficulty(lvl)}
                      className={`py-2 px-2 rounded-xl text-xs font-bold border ${difficulty === lvl ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-700 border-slate-200'}`}
                    >
                      {lvl}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Dạng bài kiểm tra (GDPT 2018)</label>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                {[
                  { id: 'mcq', label: 'Trắc nghiệm 4 đáp án', desc: 'Chọn 1 đáp án A, B, C, D' },
                  { id: 'true_false', label: 'Đúng / Sai', desc: '4 ý a, b, c, d (Mới)' },
                  { id: 'fill_blank', label: 'Điền khuyết', desc: 'Điền từ khóa chính xác' },
                  { id: 'short_essay', label: 'Tự luận ngắn', desc: 'Trả lời ý chính' }
                ].map(item => (
                  <button
                    key={item.id}
                    type="button"
                    onClick={() => setQuestionType(item.id)}
                    className={`p-3 rounded-xl border text-left transition-all ${questionType === item.id ? 'border-indigo-600 bg-indigo-50/70 ring-1 ring-indigo-600' : 'border-slate-200 hover:bg-slate-50'}`}
                  >
                    <div className="text-xs font-bold text-slate-900">{item.label}</div>
                    <div className="text-[11px] text-slate-500 mt-0.5">{item.desc}</div>
                  </button>
                ))}
              </div>
            </div>

            <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200/80 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <div className="text-xs font-bold text-slate-800">Hình thức làm bài:</div>
                <div className="text-[11px] text-slate-500">Nộp bài xong mới hiển thị đáp án chi tiết</div>
              </div>
              <div className="flex bg-white p-1 rounded-xl border border-slate-200 shrink-0">
                <button
                  type="button"
                  onClick={() => setExamMode('exam')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold ${examMode === 'exam' ? 'bg-rose-600 text-white' : 'text-slate-600'}`}
                >
                  Tự luyện thi
                </button>
                <button
                  type="button"
                  onClick={() => setExamMode('practice')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold ${examMode === 'practice' ? 'bg-indigo-600 text-white' : 'text-slate-600'}`}
                >
                  Ôn tập tự do
                </button>
              </div>
            </div>

            <button
              type="button"
              onClick={() => handleGenerateExam(false)}
              disabled={isGenerating}
              className="w-full py-3.5 px-6 rounded-xl bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-700 disabled:opacity-60 shadow-sm flex items-center justify-center gap-2"
            >
              {isGenerating ? <><Icon name="loader-2" size={18} className="animate-spin" /><span>Đang tạo đề...</span></> : <><Icon name="sparkles" size={18} /><span>Tạo đề ôn tập ngay</span></>}
            </button>
          </div>

          <div className="lg:col-span-5 bg-white rounded-2xl border border-slate-200 p-6 shadow-xs flex flex-col">
            <div className="flex items-center justify-between mb-4">
              <div>
                <h3 className="font-bold text-slate-900 flex items-center gap-2">
                  <Icon name="folder-open" size={18} className="text-indigo-600" />
                  <span>Kho đề đã tạo ({savedExams.length})</span>
                </h3>
                <p className="text-xs text-slate-500 mt-0.5">Lưu tự động để ôn lại bất cứ lúc nào.</p>
              </div>
            </div>

            <div className="space-y-3 flex-1 overflow-y-auto max-h-[680px] pr-1">
              {savedExams.length === 0 ? (
                <div className="border-2 border-dashed border-slate-200 rounded-2xl p-8 text-center text-slate-400">
                  <Icon name="file-question" size={32} className="mx-auto mb-2 opacity-60" />
                  <p className="text-sm font-medium text-slate-600">Chưa có đề thi nào</p>
                </div>
              ) : (
                savedExams.map(exam => (
                  <div key={exam.id} className="p-4 rounded-xl border border-slate-200 bg-slate-50/40 space-y-3">
                    <div className="flex items-start justify-between gap-2">
                      <div>
                        <h4 className="font-bold text-slate-900 text-sm leading-snug">{exam.title}</h4>
                        <div className="flex items-center gap-2 mt-1.5 text-[11px] text-slate-500">
                          <span className="px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 font-semibold">{exam.questions.length} câu</span>
                          <span>• {exam.difficulty}</span>
                        </div>
                        <div className="text-[11px] text-slate-400 mt-1">{exam.createdAt}</div>
                      </div>
                      <button onClick={() => setSavedExams(savedExams.filter(e => e.id !== exam.id))} className="text-slate-400 hover:text-rose-600 p-1">
                        <Icon name="trash-2" size={15} />
                      </button>
                    </div>

                    <div className="flex items-center gap-2 pt-1">
                      <button onClick={() => startExam(exam, 'practice')} className="flex-1 py-2 px-3 rounded-lg bg-white border border-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-100 flex items-center justify-center gap-1.5">
                        <Icon name="book-open-check" size={14} className="text-indigo-600" />
                        <span>Ôn tập</span>
                      </button>
                      <button onClick={() => startExam(exam, 'exam')} className="flex-1 py-2 px-3 rounded-lg bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 flex items-center justify-center gap-1.5">
                        <Icon name="timer" size={14} />
                        <span>Luyện thi</span>
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
